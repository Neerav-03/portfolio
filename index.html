    <script>
      // Apply the saved theme before first paint (no flash). Default: dark.
      // Keep in sync with DEFAULT_THEME_PREFERENCE in src/lib/theme.ts.
      (function () {
        var theme = 'dark';
        try {
          var pref = localStorage.getItem('neeravos.theme');
          if (pref === 'light' || pref === 'dark') theme = pref;
          else if (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f7');
      })();
    </script>
