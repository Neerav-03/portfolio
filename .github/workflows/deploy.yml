name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Public URL for canonical/Open Graph tags: https://<user>.github.io/<repo>/,
      # or https://<user>.github.io/ for a <user>.github.io repository.
      # Set a repository variable SITE_URL to override (e.g. a custom domain).
      - name: Resolve site URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          host="https://${OWNER,,}.github.io"
          if [ -n "$SITE_URL" ]; then url="$SITE_URL"
          elif [[ "${REPO,,}" == *.github.io ]]; then url="$host/"
          else url="$host/$REPO/"; fi
          echo "VITE_SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Site URL: $url"

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
